<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Google Sheet Data</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f5f5f5;
}

.header{
    background:#0f172a;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    padding:20px;
}

.search-box{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

.table-container{
    overflow:auto;
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2563eb;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    border:1px solid #ddd;
}

tr:nth-child(even){
    background:#f8fafc;
}
</style>
</head>

<body>

<div class="header">
<h1>Live Google Sheet Dashboard</h1>
</div>

<div class="container">

<input type="text" id="search" class="search-box"
placeholder="Search Data...">

<div class="table-container">
<table id="sheetTable"></table>
</div>

</div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/1DBdjSigo4VWFmfCgL8Z8B4Xq4ZDKUSWOlv38duO1X20/gviz/tq?tqx=out:csv&gid=315964815";

async function loadSheet(){

    const response = await fetch(csvUrl);
    const csv = await response.text();

    const rows = csv.trim().split("\n");
    let html = "";

    rows.forEach((row,index)=>{

        const cols = row.split(",");

        html += "<tr>";

        cols.forEach(col=>{

            if(index===0){
                html += `<th>${col}</th>`;
            }else{
                html += `<td>${col}</td>`;
            }

        });

        html += "</tr>";
    });

    document.getElementById("sheetTable").innerHTML = html;
}

loadSheet();

setInterval(loadSheet,30000);

document.getElementById("search").addEventListener("keyup",function(){

let filter=this.value.toLowerCase();
let tr=document.querySelectorAll("#sheetTable tr");

tr.forEach((row,index)=>{

if(index===0) return;

let text=row.innerText.toLowerCase();

row.style.display=text.includes(filter)?"":"none";

});

});

</script>

</body>
</html>
