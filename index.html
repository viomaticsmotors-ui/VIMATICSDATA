
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIOMATICS CONSTRUCTION EXPENSE  <BR>
 Email:viomaticsmotors@gmail.com<br>
phone : 9395870636</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

.header{
    background:#0f172a;
    color:#fff;
    text-align:center;
    padding:25px;
}

.container{
    padding:20px;
}

.search{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
}

.table-box{
    background:#fff;
    border-radius:10px;
    overflow:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2563eb;
    color:#fff;
    padding:12px;
}

td{
    padding:10px;
    border:1px solid #ddd;
}

tr:nth-child(even){
    background:#f8fafc;
}
</style>
</head>

<body>

<div class="header">
    <h1>VIOMATRIC CONSTRUCTION EXPENSE</h1>
</div>

<div class="container">

<input
type="text"
id="search"
class="search"
placeholder="Search..."
>

<div class="table-box">
    <table id="sheetTable"></table>
</div>

</div>

<script>

const SHEET_ID = "1DBdjSigo4VWFmfCgL8Z8B4Xq4ZDKUSWOlv38duO1X20";
const GID = "315964815";

const url =
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&tqx=out:json`;

async function loadData(){

    try{

        const res = await fetch(url);

        const txt = await res.text();

        const json =
        JSON.parse(txt.substring(47).slice(0,-2));

        let html = "";

        html += "<thead><tr>";

        json.table.cols.forEach(col=>{
            html += `<th>${col.label || ''}</th>`;
        });

        html += "</tr></thead><tbody>";

        json.table.rows.forEach(row=>{

            html += "<tr>";

            json.table.cols.forEach((c,i)=>{

                const cell =
                row.c[i] ? row.c[i].v : "";

                html += `<td>${cell}</td>`;

            });

            html += "</tr>";
        });

        html += "</tbody>";

        document.getElementById("sheetTable").innerHTML = html;

    }
    catch(err){

        document.getElementById("sheetTable").innerHTML =
        `<tr>
            <td>
            Unable to load Google Sheet.<br>
            Make sure:
            <br>1. Anyone with link = Viewer
            <br>2. Sheet ID is correct
            <br>3. GID is correct
            </td>
        </tr>`;

        console.error(err);
    }
}

loadData();

setInterval(loadData,30000);

document.getElementById("search")
.addEventListener("keyup",function(){

    let value =
    this.value.toLowerCase();

    let rows =
    document.querySelectorAll("#sheetTable tbody tr");

    rows.forEach(row=>{

        row.style.display =
        row.innerText.toLowerCase().includes(value)
        ? ""
        : "none";

    });

});
</script>

</body>
</html>
