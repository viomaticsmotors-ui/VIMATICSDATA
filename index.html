<script>
const sheetURL =
"https://docs.google.com/spreadsheets/d/1DBdjSigo4VWFmfCgL8Z8B4Xq4ZDKUSWOlv38duO1X20/gviz/tq?tqx=out:csv&gid=315964815";

async function loadSheet() {

    try {

        const response = await fetch(sheetURL);

        if (!response.ok) {
            throw new Error("Sheet not accessible");
        }

        const csv = await response.text();

        const rows = csv.split("\n");

        let html = "";

        rows.forEach((row,index)=>{

            const cols = row.split(",");

            html += "<tr>";

            cols.forEach(col=>{

                if(index===0){
                    html += `<th>${col}</th>`;
                } else {
                    html += `<td>${col}</td>`;
                }

            });

            html += "</tr>";
        });

        document.getElementById("sheetTable").innerHTML = html;

    } catch(err) {

        document.getElementById("sheetTable").innerHTML =
        `<tr><td>${err.message}</td></tr>`;

        console.error(err);
    }
}

loadSheet();
setInterval(loadSheet,30000);
</script>
